<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="78%" cy="20%" r="70%">
      <stop offset="0" stop-color="#2F6BFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2F6BFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#FFFFFF" fill-opacity="0.06"/>
    </pattern>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="44" y1="0" x2="416" y2="0">
      <stop offset="0" stop-color="#D97757" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#D97757"/>
      <stop offset="1" stop-color="#D97757" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="440" rx="18" fill="#0B0D12"/>
  <rect width="1280" height="440" rx="18" fill="url(#dots)"/>
  <rect width="1280" height="440" rx="18" fill="url(#glow)"/>

  <!-- left: title -->
  <g transform="translate(72 0)">
    <rect y="74" width="214" height="34" rx="17" fill="#D97757" fill-opacity="0.14" stroke="#D97757" stroke-opacity="0.5"/>
    <circle cx="20" cy="91" r="5" fill="#D97757"/>
    <text x="34" y="97" font-size="15" font-weight="600" fill="#F2B49D" letter-spacing="0.4">SKILL CLAUDE CODE</text>

    <text y="172" font-size="50" font-weight="700" fill="#F4F5F8" letter-spacing="-1.2">Le système de conversion</text>
    <text y="232" font-size="50" font-weight="700" fill="#F4F5F8" letter-spacing="-1.2">B2B <tspan fill="#D97757">en un seul skill</tspan></text>

    <text y="286" font-size="21" fill="#9AA3B5">Tu lui donnes ton call. Il rend la relance, les objections,</text>
    <text y="316" font-size="21" fill="#9AA3B5">la qualification, et met ton pipeline à jour.</text>

    <g transform="translate(0 352)" font-size="17" font-weight="600">
      <rect width="96" height="38" rx="10" fill="#151923" stroke="#2A3142"/>
      <text x="48" y="25" text-anchor="middle" fill="#F4F5F8">1 skill</text>
      <rect x="108" width="126" height="38" rx="10" fill="#151923" stroke="#2A3142"/>
      <text x="171" y="25" text-anchor="middle" fill="#F4F5F8">3 rythmes</text>
      <rect x="246" width="176" height="38" rx="10" fill="#151923" stroke="#2A3142"/>
      <text x="334" y="25" text-anchor="middle" fill="#F4F5F8">une mémoire</text>
    </g>
  </g>

  <!-- right: the 5 steps and the loop -->
  <g transform="translate(770 60)" font-size="15" font-weight="600" fill="#DDE2EC">
    <g>
      <rect y="0" width="460" height="46" rx="10" fill="#141824" stroke="#262D3D"/><circle cx="24" cy="23" r="4" fill="#2F6BFF"/><text x="42" y="29">1  Enregistrer le call</text>
      <rect y="58" width="460" height="46" rx="10" fill="#141824" stroke="#262D3D"/><circle cx="24" cy="81" r="4" fill="#2F6BFF"/><text x="42" y="87">2  Qualifier : budget, décideur, besoin, timing</text>
      <rect y="116" width="460" height="46" rx="10" fill="#141824" stroke="#D97757" stroke-opacity="0.7"/><circle cx="24" cy="139" r="4" fill="#D97757"/><text x="42" y="145">3  Une réponse écrite par objection</text>
      <rect y="174" width="460" height="46" rx="10" fill="#141824" stroke="#262D3D"/><circle cx="24" cy="197" r="4" fill="#2F6BFF"/><text x="42" y="203">4  Relancer sous 24 h, avec ses mots</text>
      <rect y="232" width="460" height="46" rx="10" fill="#141824" stroke="#262D3D"/><circle cx="24" cy="255" r="4" fill="#2F6BFF"/><text x="42" y="261">5  Revue du lundi</text>
    </g>
    <rect y="296" width="460" height="46" rx="10" fill="#1A2133" stroke="#2F6BFF" stroke-opacity="0.8"/>
    <text x="230" y="325" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Autopsie du mois, les réponses s'améliorent</text>
    <path d="M440 296 V150 H460" fill="none" stroke="#D97757" stroke-width="2" stroke-opacity="0.9"/>
  </g>
</svg>
